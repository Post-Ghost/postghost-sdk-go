    get:
      operationId: ListProjectLogsTimeline
      summary: Logs timeline (counts per bucket and status)
      description: |
        Returns time-bucketed log counts per status for a stacked bar chart. Each bucket has counts for debug, info, warn, error. Time range can be sent via fromTime/toTime (explicit) or span (e.g. last 24h). Bucket interval is configurable (default 1h). Requires authentication via Bearer token with human JWT.
      tags:
        - Logs
      security:
        - HumanJWT: []
      parameters:
        - in: path
          name: project_id
          schema:
            type: string
            format: uuid
          required: true
          description: Project ID
        - in: query
          name: fromTime
          schema:
            type: string
            format: date-time
          description: Start of time range (UTC). If omitted, use span or default last 24h.
        - in: query
          name: toTime
          schema:
            type: string
            format: date-time
          description: End of time range (UTC). If omitted, defaults to now.
        - in: query
          name: span
          schema:
            type: string
            enum: [1h, 6h, 24h, 7d]
          description: Time span as "last X" (1h, 6h, 24h, 7d). Ignored if fromTime and toTime are both provided.
        - in: query
          name: interval
          schema:
            type: string
            enum: [15m, 1h, 1d]
            default: 1h
          description: Bucket interval for the chart (15m, 1h, or 1d). Default 1h.
      responses:
        '200':
          description: Timeline retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogTimelineResponse'
