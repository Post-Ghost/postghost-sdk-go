      description: |
        **Offset-based pagination only.** Returns log events for the project with full details (id, message, status, source, date, payload, etc.). Filter by time range (default last 24h), status (level), and search in message. Requires authentication via Bearer token with human JWT.
      tags:
        - Logs
      security:
        - HumanJWT: []
      parameters:
        - in: path
          name: project_id
          schema:
            type: string
            format: uuid
          required: true
          description: Project ID
        - in: query
          name: fromTime
          schema:
            type: string
            format: date-time
          description: Only include logs received at or after this time (UTC). Omitted with toTime defaults to last 24 hours.
        - in: query
          name: toTime
          schema:
            type: string
            format: date-time
          description: Only include logs received before this time (UTC). Omitted with fromTime defaults to now.
        - in: query
          name: status
          schema:
            type: string
            enum: [debug, info, warn, error]
          description: Filter by log level (status)
        - in: query
          name: search
          schema:
            type: string
          description: Substring search in log message
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
