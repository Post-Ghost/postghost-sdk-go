          schema:
            type: string
            example: "1.0.0"
        - name: X-PostGhost-SDK-Name
          in: header
          required: false
          description: Identifier for the SDK or client (e.g. node, python, curl). Optional.
          schema:
            type: string
            example: node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestionLogsRequestBody'
      responses:
        '202':
          description: Log event accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogsAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: Invalid request body or JSON format
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Missing or invalid authentication token
        '403':
          $ref: '#/components/responses/Forbidden'
          description: Token does not have project scope
        '413':
          description: Request body exceeds size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              example:
                code: too_large
                slug: payload-too-large
                message: Request body exceeds size limit
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: Service unavailable (enqueue/publish failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              example:
                code: unavailable
                slug: enqueue-failed
                message: Service unavailable

  /jobs:
    get:
      operationId: GetJobs
      summary: List jobs for a project
      description: |
        Retrieves a paginated list of jobs for the given project with optional filtering and sorting.
        User must be a member of the project.
      tags:
        - Jobs
      security:
        - HumanJWT: []
      parameters:
        - in: query
          name: projectId
          schema:
            type: string
          required: true
          description: Project ID to list jobs for
          example: proj_456def
        - in: query
          name: name
          schema:
            type: string
          description: Filter by job name (partial match)
          example: "Background"
        - in: query
          name: healthStatus
          schema:
            type: string
            enum: [unknown, up, down, degraded]
          description: Filter by health status
          example: up
        - in: query
          name: operationalStatus
          schema:
            type: string
            enum: [active, inactive]
          description: Filter by operational status
          example: active
        - in: query
          name: sort
          schema:
            type: string
            enum: [lastPulseAt, createdAt, updatedAt, name]
            default: createdAt
          description: Field to sort by
          example: lastPulseAt
        - in: query
          name: sortOrder
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort order (ascending or descending)
          example: desc
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (1-indexed)
          example: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of items per page
          example: 20
      responses:
        '200':
          description: Jobs retrieved successfully (includes overview counts and lastPulsesStatus per job)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobsListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: Invalid project ID or query parameters
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: CreateJob
      summary: Create a job
      description: |
        Creates a new job entry.
      tags:
        - Jobs
      security:
        - HumanJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobPayload'
      responses:
        '201':
          description: Job created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: Invalid request body or JSON format
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
