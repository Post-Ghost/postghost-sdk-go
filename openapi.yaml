      summary: Get pulses for a specific job
      description: |
        Retrieves a cursor-paginated list of pulses for a specific job.
        Returns pulses in reverse chronological order (newest first).
      tags:
        - Jobs
      security:
        - HumanJWT: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
          description: The job ID (UUID)
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Number of pulses to return per page
          example: 50
        - in: query
          name: cursor
          schema:
            type: string
          description: Cursor for pagination (from previous response's nextCursor)
          example: eyJyZWNlaXZlZEF0IjoiMjAyNC0wNi0xOFQxNjowMDowMFoifQ==
