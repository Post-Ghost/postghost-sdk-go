      summary: Endpoint detail by event ID
      description: |
        **Use this for: detailed view of one endpoint.** Pass the ingestion **eventId** (from the API calls list). Access is enforced by verifying the authenticated user can access the project that owns the event. Returns latest status code and latency, service name, average latency over last 24h, errors count in last 24h with time-series buckets for graphing, and the latest request/response bodies. Optional toTime (RFC3339) sets the end of the 24h window (default now).
      tags:
        - API Monitoring
      security:
        - HumanJWT: []
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: string
            format: uuid
          description: Ingestion event ID (from the API calls list)
        - in: query
          name: toTime
          schema:
            type: string
            format: date-time
          description: End of the 24h window (UTC). Default is now.
      responses:
        '200':
          description: Endpoint detail retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMonitoringEndpointDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: Invalid eventId format
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: Event not found or user cannot access the event's project
        '500':
          $ref: '#/components/responses/InternalServerError'

  /ingestion/pulse/{externalId}:
    post:
      operationId: IngestPulse
      summary: Ingest a pulse from a job
      description: |
        Accepts a pulse event from a job/script to indicate it's running.
        Authenticate with the project API key via the X-Api-Key header. The job is identified by externalId in the path.
        The API key's org and project must match the job's org and project.
      tags:
        - Ingestion
      security:
        - ProjectAPIKey: []
      parameters:
        - name: externalId
          in: path
          required: true
          description: External ID of the job sending the pulse (must belong to the API key's project).
          schema:
            type: string
            example: job_abc123
        - name: X-PostGhost-SDK-Version
          in: header
          required: false
          description: Version of the client or PostGhost SDK (e.g. 1.0.0). Optional; used for analytics and support.
          schema:
            type: string
            example: "1.0.0"
        - name: X-PostGhost-SDK-Name
          in: header
          required: false
          description: Identifier for the SDK or client (e.g. node, python, curl). Optional.
          schema:
            type: string
            example: node
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PulsePayload'
      responses:
        '202':
          description: Pulse accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PulseAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: Invalid request body or JSON format
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Missing or invalid authentication token
        '403':
          $ref: '#/components/responses/Forbidden'
          description: Token does not have project scope or job does not belong to project
        '404':
          $ref: '#/components/responses/NotFound'
          description: Job not found or job does not belong to the API key's project
        '413':
          description: Request body exceeds size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              example:
                code: too_large
                slug: payload-too-large
                message: Request body exceeds 4KB limit
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: Service unavailable (enqueue/publish failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              example:
                code: unavailable
                slug: enqueue-failed
                message: Service unavailable

  /ingestion/api-monitoring:
    post:
      operationId: IngestApiMonitoring
      summary: Submit API monitoring event
      description: |
        Accepts one or more API call events for outbound HTTP monitoring (e.g. from PostGhost SDK).
        Request body may be a single ApiMonitoringPayload object or an array of ApiMonitoringPayload; when array, each element is processed independently and response eventIds contains one id per element in order.
        Authenticate with the project API key via the X-Api-Key header.
        Request/response bodies and metadata are stored for dashboard and alerting. Processing is idempotent by event_id.

        **Setting up multiple APIs:** There is no separate "add API" or registration step. Use this same endpoint for every external API you monitor. Identify each integration by the `serviceName` field in the payload (e.g. "stripe", "ticketmaster", "sendgrid"). To monitor a second API, instrument it with the SDK and send events with a different `serviceName`; they will appear as a separate service in the API Monitoring dashboard.
      tags:
        - Ingestion
      security:
        - ProjectAPIKey: []
      parameters:
        - name: X-PostGhost-SDK-Version
          in: header
          required: false
          description: Version of the client or PostGhost SDK (e.g. 1.0.0). Same as pulse and logs; use headers only for consistency.
          schema:
            type: string
            example: "1.0.0"
        - name: X-PostGhost-SDK-Name
          in: header
          required: false
          description: Identifier for the SDK or client (e.g. node, python, curl). Optional.
          schema:
            type: string
            example: node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ApiMonitoringPayload'
                - $ref: '#/components/schemas/ApiMonitoringPayloadBatch'
      responses:
        '202':
          description: API monitoring event accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMonitoringAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: Invalid request body or JSON format
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Missing or invalid authentication token
        '403':
          $ref: '#/components/responses/Forbidden'
          description: Token does not have project scope
        '413':
          description: Request body exceeds size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              example:
                code: too_large
                slug: payload-too-large
                message: Request body exceeds size limit
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: Service unavailable (enqueue/publish failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
              example:
                code: unavailable
                slug: enqueue-failed
                message: Service unavailable

  /ingestion/logs:
    post:
      operationId: IngestLogs
      summary: Submit log event
      description: |
        Accepts a log event in one of two forms. Authenticate with the project API key via the X-Api-Key header.
        Logs are stored in ClickHouse for querying and dashboards. Processing is idempotent by event_id.

        **Structured** — Send a payload with required `level` (debug|info|warn|error) and `message`, plus optional
        timestamp, attributes, jobId, source. Stored as-is (no _raw wrapper).

        **Raw** — Send a payload with `rawLog` as a string (a single log line or JSON string). The server parses and normalizes it into the structured log model (like Datadog).
      tags:
