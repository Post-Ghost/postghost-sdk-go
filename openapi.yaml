  /projects/{project_id}/api-monitoring:
    get:
      operationId: ListProjectApiMonitoring
      summary: Recent API calls
      description: |
        **Use this for: recent calls list.** Paginated list of individual API calls. Each item has method (GET/POST/etc), url, serviceName, date (receivedAt), statusCode, response time in ms (latencyMs), and optionally request/response bodies. Filter by serviceName, method, or statusCode. Requires authentication via Bearer token with human JWT.
      tags:
        - API Monitoring
      security:
        - HumanJWT: []
      parameters:
        - in: path
          name: project_id
          schema:
            type: string
            format: uuid
          required: true
          description: Project ID
        - in: query
          name: serviceName
          schema:
            type: string
          description: Filter by service name
        - in: query
          name: method
          schema:
            type: string
          description: Filter by HTTP method
        - in: query
          name: statusCode
          schema:
            type: integer
            format: int32
          description: Filter by response status code
        - in: query
          name: fromTime
          schema:
            type: string
            format: date-time
          description: Only include events received at or after this time (UTC). Omitted with toTime defaults to last 24 hours.
        - in: query
          name: toTime
          schema:
            type: string
            format: date-time
          description: Only include events received before this time (UTC). Omitted with fromTime defaults to now.
        - in: query
          name: cursor
          schema:
            type: string
          description: Opaque cursor for the next page (from previous response nextCursor). Use with limit for keyset pagination.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Page size (default 20, max 100).
      responses:
        '200':
          description: API calls retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMonitoringListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: Invalid project ID or query parameters
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: Project not found
        '500':
          $ref: '#/components/responses/InternalServerError'

